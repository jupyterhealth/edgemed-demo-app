name: jupyter_health
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  auto_route: ^11.1.0
  get_it: ^9.2.0
  injectable: ^3.0.0
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  meta: ^1.17.0
  logger: ^2.6.2
  dio: ^5.9.1
  retrofit: ^4.9.2
  dartz: ^0.10.1
  flutter_svg: ^2.2.3
  flutter_gen: ^5.12.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce_flutter: ^2.3.4
  hive_ce: ^2.19.3
  flutter_secure_storage: ^10.0.0
  open_wearables_health_sdk: ^0.0.22
  sentry_flutter: ^9.26.0
  fl_chart: ^1.2.0
  firebase_core: ^4.13.0
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: 10.5.0
  injectable_generator: 3.0.2
  retrofit_generator: ^10.2.4
  build_runner: '>=2.11.1 <2.15.2'
  flutter_gen_runner: ^5.12.0
  freezed: 3.2.5
  hive_ce_generator: 1.11.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true
  config:
    # Firebase plugins require iOS 15. Flutter's generated SwiftPM package
    # hardcodes 13.0 and that value is what Xcode archive validates.
    enable-swift-package-manager: false
  assets:
    - assets/images/
    - assets/images/svg/
    - assets/images/png/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/font/outfit/Outfit-Thin.ttf
          weight: 100
        - asset: assets/font/outfit/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/font/outfit/Outfit-Light.ttf
          weight: 300
        - asset: assets/font/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/font/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/font/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/font/outfit/Outfit-Bold.ttf
          weight: 700
        - asset: assets/font/outfit/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/font/outfit/Outfit-Black.ttf
          weight: 900

